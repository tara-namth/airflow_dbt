clickhouse_transformations:
  target: dev
  outputs:
    dev:
      type: clickhouse
      host: "{{ env_var('CLICKHOUSE_HOST') }}"
      port: "{{ env_var('CLICKHOUSE_PORT', '8123') | int }}"
      user: "{{ env_var('CLICKHOUSE_USER', 'default') }}"
      password: "{{ env_var('CLICKHOUSE_PASSWORD', '') }}"
      schema: "{{ env_var('CLICKHOUSE_DATABASE', 'default') }}"
      # dbt's as_bool filter accepts Python boolean literals (True/False), not
      # lowercase strings such as "false" commonly used in Docker env files.
      secure: "{{ env_var('CLICKHOUSE_SECURE', 'False') | as_bool }}"
      threads: 4
