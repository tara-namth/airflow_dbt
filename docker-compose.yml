x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: airflow/Dockerfile
  image: airflow-local:3.3.2-fab
  environment: &airflow-env
    # PostgreSQL bên ngoài Docker; Airflow sẽ quản lý metadata của nó tại đây.
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_DB_URL}
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    # Airflow 3 cần task process gọi lại Execution API của api-server.
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    # Phải giống nhau ở api-server, scheduler và dag-processor để các JWT của
    # Execution API được xác thực được giữa các process/container.
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?Set AIRFLOW_JWT_SECRET in .env to a long random value}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    # FAB xác thực bằng user/password lưu trong PostgreSQL metadata database.
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    DBT_PROFILES_DIR: /opt/airflow/dbt
    CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-}
    CLICKHOUSE_PORT: ${CLICKHOUSE_PORT:-8123}
    CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
    CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
    CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-default}
    CLICKHOUSE_SECURE: ${CLICKHOUSE_SECURE:-False}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./dbt:/opt/airflow/dbt
    - airflow-logs:/opt/airflow/logs

services:
  # Chạy một lần: tạo/nâng cấp các bảng metadata của Airflow.
  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    environment:
      <<: *airflow-env
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "$${AIRFLOW_ADMIN_USER}" \
          --password "$${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Admin --lastname User --role Admin \
          --email admin@example.com || true
    restart: "no"

  # UI, Core API và Execution API tại http://localhost:8080.
  # Airflow 3 thay thế lệnh `webserver` bằng `api-server`.
  airflow-api-server:
    <<: *airflow-common
    container_name: airflow-api-server
    command: api-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    healthcheck:
      # Endpoint monitor công khai và phản ánh tình trạng các thành phần Airflow.
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # LocalExecutor tạo process thực thi task ngay trong scheduler này.
  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-api-server:
        condition: service_healthy

  # Airflow 3 bắt buộc parser DAG chạy thành process độc lập.
  airflow-dag-processor:
    <<: *airflow-common
    container_name: airflow-dag-processor
    command: dag-processor
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-api-server:
        condition: service_healthy

volumes:
  airflow-logs:
